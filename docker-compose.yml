services:
  control-api:
    build: ./services/control-api
    environment:
      DISCOVERY_WORKER_URL: http://discovery-worker:8091
      ANALYSIS_SERVICE_URL: http://analysis-service:8093
      NETSCALER_ADAPTER_URL: http://netscaler-adapter:8092
      DATABASE_URL: postgresql://waf:${WAF_DB_PASSWORD:?Set WAF_DB_PASSWORD in the deployment environment}@postgres:5432/waf
      CREDENTIAL_KEY_FILE: /run/secrets/credential_encryption_key
      NETSCALER_WRITE_ENABLED: "false"
      SIGNATURE_UPSTREAM_INDEX_FILE: /run/upstream-signatures/latest.json
    ports:
      - "8110:8090"
    depends_on:
      postgres:
        condition: service_healthy
      discovery-worker:
        condition: service_started
      netscaler-adapter:
        condition: service_started
    secrets:
      - credential_encryption_key
    volumes:
      - ./signature-cache/upstream/index:/run/upstream-signatures:ro

  discovery-worker:
    build: ./services/discovery-worker
    environment:
      CONTROL_API_URL: http://control-api:8090
      DATABASE_URL: postgresql://waf:${WAF_DB_PASSWORD:?Set WAF_DB_PASSWORD in the deployment environment}@postgres:5432/waf
      SIGNATURE_TECHNOLOGY_INDEX_FILE: /run/upstream-signatures/latest.json
    volumes:
      - ./signature-cache/index:/run/signature-index:ro
      - ./signature-cache/upstream/index:/run/upstream-signatures:ro
    expose:
      - "8091"
    depends_on:
      postgres:
        condition: service_healthy
  analysis-service:
    build: ./services/analysis-service
    expose:
      - "8093"
    depends_on:
      discovery-worker:
        condition: service_started

  runtime-inspector:
    build: ./services/runtime-inspector
    expose:
      - "8094"
    depends_on:
      discovery-worker:
        condition: service_started

  netscaler-adapter:
    build: ./services/netscaler-adapter
    environment:
      NETSCALER_HOST: 192.168.11.101
      NETSCALER_USERNAME: mcp_user
      NETSCALER_PASSWORD_FILE: /run/secrets/netscaler_password
      NETSCALER_NEXTGEN_SCHEME: https
      NETSCALER_NEXTGEN_BASE_URL: ""
      NETSCALER_NEXTGEN_SESSION_TIMEOUT: 30min
      NETSCALER_SSH_ENABLED: "true"
      NETSCALER_SSH_HOST: 192.168.11.101
      NETSCALER_SSH_USERNAME: mcp_user
      NETSCALER_SSH_PASSWORD_FILE: /run/secrets/netscaler_password
      NETSCALER_SSH_STRICT_HOST_KEY: "false"
      NETSCALER_SIGNATURE_RULE_CATALOG_FILE: /run/catalogs/netscaler_rule_catalog.json
      NETSCALER_WRITE_ENABLED: "false"
    volumes:
      - ./catalogs:/run/catalogs:ro
    secrets:
      - netscaler_password
    expose:
      - "8092"

  signature-sync:
    build:
      context: .
      dockerfile: services/signature-sync/Dockerfile
    environment:
      SIGNATURE_SOURCE_URL: https://s3.amazonaws.com/NSAppFwSignatures/SignaturesMapping.xml
      SIGNATURE_TARGET_RELEASE: "14.1"
      SIGNATURE_TARGET_BUILD: "0"
      SIGNATURE_SYNC_INTERVAL_SECONDS: "3600"
      SIGNATURE_SYNC_RUN_ON_START: "true"
      SIGNATURE_SYNC_VERIFY_SHA1: "true"
      SIGNATURE_SYNC_VERIFY_CITRIX_SIGNATURE: "true"
      SIGNATURE_PUBLIC_KEY_FILE: /run/signature-sync/citrix_public.pem
      SIGNATURE_SYNC_DATA_DIR: /var/lib/signature-sync
    volumes:
      - ./signature-cache:/var/lib/signature-sync
      - ./signature-cache/citrix_public.pem:/run/signature-sync/citrix_public.pem:ro
    expose:
      - "8095"
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8180:80"
    depends_on:
      - control-api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: waf
      POSTGRES_USER: waf
      POSTGRES_PASSWORD: ${WAF_DB_PASSWORD:?Set WAF_DB_PASSWORD in the deployment environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waf -d waf"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

secrets:
  netscaler_password:
    file: ./secrets/netscaler_password
  credential_encryption_key:
    file: ./secrets/credential_encryption_key
