limit_req_zone $binary_remote_addr zone=operator_login:10m rate=5r/m;

server {
  listen 80 default_server;
  server_name _;
  return 308 https://192.168.11.90$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name 192.168.11.90;
  if ($host != "192.168.11.90") { return 421; }
  ssl_certificate /run/secrets/waf_tls_certificate;
  ssl_certificate_key /run/secrets/waf_tls_private_key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 10m;
  ssl_session_cache shared:WAF_TLS:10m;
  add_header Strict-Transport-Security "max-age=86400" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  client_max_body_size 2m;
  root /usr/share/nginx/html;
  index index.html;

  location = /api/auth/login {
    limit_req zone=operator_login burst=5 nodelay;
    proxy_pass http://control-api:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  location /api/ {
    proxy_pass http://control-api:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 240s;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
